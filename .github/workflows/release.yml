name: Build and Release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install UI deps
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Build UI
        working-directory: ui
        run: pnpm run build

      - name: Run Go tests
        run: go test ./...

      - name: Build binary
        run: go build -o vibego .

  release:
    name: Release Assets
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install UI deps
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Build UI
        working-directory: ui
        run: pnpm run build

      - name: Build release artifacts
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p dist

          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
            "windows arm64"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch <<<"$target"
            bin_name="vibego"
            ext=""
            pkg_ext="tar.gz"

            if [ "$goos" = "windows" ]; then
              ext=".exe"
              pkg_ext="zip"
            fi

            artifact="vibego-${TAG}-${goos}-${goarch}"
            out_dir="dist/$artifact"
            mkdir -p "$out_dir"

            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -o "$out_dir/${bin_name}${ext}" .

            if [ "$pkg_ext" = "zip" ]; then
              (
                cd dist
                zip -r "${artifact}.zip" "$artifact"
              )
            else
              tar -C dist -czf "dist/${artifact}.tar.gz" "$artifact"
            fi

            rm -rf "$out_dir"
          done

          (
            cd dist
            sha256sum * > checksums.txt
          )

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

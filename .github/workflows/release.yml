name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^\/\/ @version \(.*\)$/\1/p' main.go | head -n 1)"
          if [ -z "${version}" ]; then
            echo "missing version"
            exit 1
          fi

          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  verify:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false

      - name: Install Go test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxkbcommon-x11-dev

      - name: Frontend checks
        run: |
          cd ui
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run build

      - name: Go tests
        run: go test ./...

      - name: Release packaging tests
        run: uv run python scripts/test_release_packages.py

  build:
    needs: [meta, verify]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: android
            goarch: arm64
            cgo_enabled: 0
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo_enabled: 1
            cc: gcc
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cgo_enabled: 1
            cc: gcc
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            cgo_enabled: 1
            cc: clang
          - runner: macos-15
            goos: darwin
            goarch: arm64
            cgo_enabled: 1
            cc: clang
          - runner: windows-latest
            goos: windows
            goarch: amd64
            cgo_enabled: 1
            cc: gcc
            msystem: UCRT64
            msys_packages: mingw-w64-ucrt-x86_64-gcc
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            cgo_enabled: 1
            cc: clang
            msystem: CLANGARM64
            msys_packages: mingw-w64-clang-aarch64-clang

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux build dependencies
        if: ${{ matrix.goos == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxkbcommon-x11-dev

      - uses: msys2/setup-msys2@v2
        if: ${{ matrix.goos == 'windows' }}
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.msys_packages }}
          path-type: inherit

      - name: Build frontend
        run: |
          cd ui
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build backend
        if: ${{ matrix.goos != 'windows' }}
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
          CC: ${{ matrix.cc }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION_TAG: ${{ needs.meta.outputs.tag }}
        run: |
          mkdir -p dist
          ext=""
          if [ "${GOOS}" = "windows" ]; then ext=".exe"; fi
          output="vibego_${VERSION_TAG}_${GOOS}_${GOARCH}${ext}"
          go build -trimpath -ldflags "-s -w -X github.com/xxnuo/vibego/internal/version.Version=${VERSION_TAG}" -o "dist/${output}" ./

      - name: Build backend
        if: ${{ matrix.goos == 'windows' }}
        shell: msys2 {0}
        env:
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
          CC: ${{ matrix.cc }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION_TAG: ${{ needs.meta.outputs.tag }}
        run: |
          mkdir -p dist
          ext=""
          if [ "${GOOS}" = "windows" ]; then ext=".exe"; fi
          output="vibego_${VERSION_TAG}_${GOOS}_${GOARCH}${ext}"
          go build -trimpath -ldflags "-s -w -X github.com/xxnuo/vibego/internal/version.Version=${VERSION_TAG}" -o "dist/${output}" ./

      - name: Package artifact
        shell: bash
        env:
          VERSION_TAG: ${{ needs.meta.outputs.tag }}
        run: |
          mkdir -p artifacts
          bin="vibego_${VERSION_TAG}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            bin="${bin}.exe"
          fi
          tar_name="${bin%.exe}.tar.gz"
          bash scripts/package_release_archive.sh dist "artifacts/${tar_name}" "${bin}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifacts/*.tar.gz
          if-no-files-found: error

  release:
    needs: [meta, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Collect files
        run: |
          mkdir -p release
          find release-artifacts -type f -name '*.tar.gz' -exec cp {} release/ \;
          cd release
          sha256sum *.tar.gz > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/checksums.txt

      - name: Trigger npm workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          is_prerelease="false"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            is_prerelease="true"
          fi

          payload_file="$(mktemp)"
          cat > "${payload_file}" <<JSON
          {
            "event_type": "npm-release",
            "client_payload": {
              "tag": "${TAG}",
              "version": "${version}",
              "is_prerelease": ${is_prerelease}
            }
          }
          JSON

          gh api repos/${GITHUB_REPOSITORY}/dispatches --method POST --input "${payload_file}"
